# Production environment overrides — Hetzner k3s single-node
replicaCount: 1

image:
  repository: ghcr.io/nwagbara-group-llc/messagebroker-engine
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

config:
  broker:
    port: 8080
    max_connections: 10000
    buffer_size: 65536
    timeout_seconds: 30

  performance:
    thread_pool_size: 4
    message_queue_size: 100000
    cache_size: 1000
    enable_metrics: true

  logging:
    level: "INFO"
    format: "json"
    enable_file_logging: false

  security:
    enable_tls: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  metricsPort: 9090
  tcpPort: 8081

persistence:
  enabled: true
  size: 10Gi
  storageClass: "local-path"
  logs:
    enabled: false

# Disable Elasticsearch logging (optional — will be empty string if not in Key Vault)
secrets:
  existingSecret: "messagebroker-secrets"
  elasticsearch:
    enabled: false

# No Redis state sync needed for single replica
redis:
  enabled: false

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

serviceMonitor:
  enabled: false

networkPolicy:
  enabled: false

affinity: {}

priorityClassName: ""
