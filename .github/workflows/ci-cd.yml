# MessageBrokerEngine CI/CD Pipeline
# Builds on ubuntu-latest, deploys to k3s on Hetzner via GHCR

name: MessageBrokerEngine CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false

concurrency:
  group: messagebroker-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/messagebroker-engine
  NAMESPACE: messagebroker
  HELM_CHART_PATH: k8s/message-broker-engine
  DOCKER_BUILDKIT: 1

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed || steps.skip-test-result.outputs.passed }}
    steps:
      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          path: MessageBrokerEngine

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ref: main
          path: LoggingEngine

      # cargo's own git fetch of a private repo has no credential wired in this
      # job (no .netrc, no global credential.helper) -- it only ever worked via
      # a stale warm cargo-git-db cache. Patch ultra-logger to the checkout
      # above instead of letting cargo fetch it again, same pattern already
      # proven in BacktestingCore/databaseschema-internal's CI.
      - name: Patch ultra-logger to the local LoggingEngine checkout
        run: |
          mkdir -p MessageBrokerEngine/.cargo
          cat >> MessageBrokerEngine/.cargo/config.toml <<EOF
          [patch."https://github.com/Mendl-Labs/LoggingEngine"]
          ultra-logger = { path = "${{ github.workspace }}/LoggingEngine/ultra-logger" }
          EOF

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            MessageBrokerEngine/target/
          key: ${{ runner.os }}-cargo-msgbroker-${{ hashFiles('MessageBrokerEngine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msgbroker-

      - name: Check for Skip Tests Flag
        id: check-skip
        run: |
          cd MessageBrokerEngine
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -q '\[skip-tests\]'; then
            echo "[SKIP] skip-tests flag detected"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Running full validation with tests"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast Check
        run: |
          cd MessageBrokerEngine
          cargo check --workspace
          echo "[OK] Fast check passed!"

      - name: Build Workspace
        run: |
          cd MessageBrokerEngine
          cargo build --workspace
          echo "[OK] Build passed!"

      - name: Run Tests
        if: steps.check-skip.outputs.skip != 'true'
        id: test-result
        run: |
          cd MessageBrokerEngine
          if cargo test --workspace; then
            echo "[OK] Tests passed!"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "[FAIL] Tests failed!"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Skip Tests
        if: steps.check-skip.outputs.skip == 'true'
        id: skip-test-result
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Install cargo-tarpaulin
        if: steps.check-skip.outputs.skip != 'true'
        run: cargo install cargo-tarpaulin --force

      - name: Run Rust Coverage
        if: steps.check-skip.outputs.skip != 'true'
        continue-on-error: true
        run: |
          cd MessageBrokerEngine
          cargo tarpaulin --workspace --out xml --output-dir ./coverage --timeout 300
          echo "[OK] Coverage run complete"

      - name: Upload Coverage to Codecov
        if: steps.check-skip.outputs.skip != 'true'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: messagebrokerengine
          files: MessageBrokerEngine/coverage/cobertura.xml
          fail_ci_if_error: false

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.tests-passed == 'true' || github.event.inputs.skip_tests == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          path: MessageBrokerEngine
          fetch-depth: 0

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine
          ref: main
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        run: |
          set -e
          echo "Building Docker image..."

          if [ -d "LoggingEngine" ]; then
            echo "[OK] Dependency found: LoggingEngine"
          else
            echo "[ERROR] Missing: LoggingEngine"
            exit 1
          fi

          cat > .dockerignore <<'IGNORE'
          **/.git/
          **/.gitignore
          **/.github/
          **/target/
          **/.vscode/
          **/.idea/
          **/*.swp
          **/.DS_Store
          **/.env
          **/*.md
          **/LICENSE
          **/Dockerfile
          **/.dockerignore
          **/docker-compose.yml
          **/compose.yaml
          MessageBrokerEngine/k8s/
          **/.cargo/
          **/Makefile
          IGNORE

          LOGGING_SHA=$(git -C LoggingEngine rev-parse --short HEAD)
          echo "[INFO] Dependency versions: LoggingEngine=$LOGGING_SHA"

          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "[INFO] Building with immutable tag: $SHORT_SHA"

          docker build \
            --platform linux/amd64 \
            --tag ${{ env.IMAGE_NAME }}:$SHORT_SHA \
            --file MessageBrokerEngine/Dockerfile \
            --build-arg LOGGING_ENGINE_SHA=$LOGGING_SHA \
            --build-arg RUST_VERSION=1.85.0 \
            --progress=plain \
            .

          echo "[PUSH] Pushing image..."
          docker push ${{ env.IMAGE_NAME }}:$SHORT_SHA
          # :latest intentionally NOT pushed. Mutable tags + IfNotPresent pullPolicy
          # caused stale-image incidents (see 2026-05-30 audit). Deploy by SHA only.
          echo "[OK] Pushed image with tag: $SHORT_SHA (immutable SHA only)"

      - name: Security Scan
        continue-on-error: true
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "[SCAN] Running security scan with Trivy..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --exit-code 0 --format table ${{ env.IMAGE_NAME }}:$SHORT_SHA
          echo "[OK] Security scan complete"

      - name: Validate Image
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "Validating image..."
          docker pull ${{ env.IMAGE_NAME }}:$SHORT_SHA
          IMAGE_SIZE=$(docker inspect ${{ env.IMAGE_NAME }}:$SHORT_SHA --format='{{.Size}}' | awk '{printf "%.1f", $1/1048576}')
          echo "[INFO] Image size: ${IMAGE_SIZE} MB"
          docker run --rm ${{ env.IMAGE_NAME }}:$SHORT_SHA ls -la /bin/server
          echo "[OK] Validation complete"

      - name: Build Summary
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo ""
          echo "=========================================="
          echo "Build Summary"
          echo "=========================================="
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Tag: $SHORT_SHA"
          echo "Pull: docker pull ${{ env.IMAGE_NAME }}:$SHORT_SHA"
          echo "=========================================="

  deploy-qa:
    name: Deploy to QA & Smoke Test
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && vars.KUBERNETES_ENABLED == 'true'
    timeout-minutes: 20
    env:
      TARGET_NAMESPACE: messagebroker-qa
      VALUES_FILE: values-qa.yaml
      RELEASE_NAME: messagebroker-engine
    steps:
      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          path: MessageBrokerEngine

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.3'

      - name: Configure Kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Fetch Secrets from Azure Key Vault
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          set -euo pipefail
          CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')
          CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')
          TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId')
          az login --service-principal --username "$CLIENT_ID" --password "$CLIENT_SECRET" --tenant "$TENANT_ID" --output none
          for SECRET_NAME in POSTGRES-HOST POSTGRES-PORT POSTGRES-USER POSTGRES-PASSWORD POSTGRES-DB; do
            ENV_NAME="${SECRET_NAME//-/_}"
            VALUE=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$SECRET_NAME" --query value -o tsv)
            echo "::add-mask::$VALUE"
            echo "${ENV_NAME}=${VALUE}" >> "$GITHUB_ENV"
          done
          for SECRET_NAME in ELASTIC-CLOUD-ENDPOINT ELASTIC-CLOUD-USERNAME ELASTIC-CLOUD-PASSWORD; do
            ENV_NAME="${SECRET_NAME//-/_}"
            VALUE=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$SECRET_NAME" --query value -o tsv 2>/dev/null) || VALUE=""
            [ -n "$VALUE" ] && echo "::add-mask::$VALUE"
            echo "${ENV_NAME}=${VALUE}" >> "$GITHUB_ENV"
          done

      - name: Deploy to QA
        run: |
          set -euo pipefail
          cd MessageBrokerEngine
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo "[QA] Deploying $IMAGE_TAG to namespace $TARGET_NAMESPACE"

          kubectl create namespace "$TARGET_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --namespace="$TARGET_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
          kubectl create secret generic messagebroker-secrets \
            --from-literal=database-username="${POSTGRES_USER}" \
            --from-literal=database-password="${POSTGRES_PASSWORD}" \
            --from-literal=database-host="${POSTGRES_HOST}" \
            --from-literal=database-port="${POSTGRES_PORT}" \
            --from-literal=database-name="${POSTGRES_DB}" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=elasticsearch-endpoint="${ELASTIC_CLOUD_ENDPOINT:-}" \
            --from-literal=elasticsearch-username="${ELASTIC_CLOUD_USERNAME:-}" \
            --from-literal=elasticsearch-password="${ELASTIC_CLOUD_PASSWORD:-}" \
            --namespace="$TARGET_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          STATUS=$(helm list -n "$TARGET_NAMESPACE" --all -o json 2>/dev/null | jq -r '.[] | select(.name=="'"$RELEASE_NAME"'") | .status' || echo "")
          if [[ "$STATUS" == *"pending"* ]] || [ "$STATUS" = "failed" ]; then
            helm uninstall "$RELEASE_NAME" -n "$TARGET_NAMESPACE" --wait --timeout 2m 2>/dev/null || true
            sleep 5
          fi

          helm upgrade --install "$RELEASE_NAME" ./${{ env.HELM_CHART_PATH }} \
            --namespace "$TARGET_NAMESPACE" \
            --create-namespace \
            -f ./${{ env.HELM_CHART_PATH }}/$VALUES_FILE \
            --set "image.repository=${{ env.IMAGE_NAME }}" \
            --set "image.tag=$IMAGE_TAG" \
            --set "image.pullPolicy=IfNotPresent" \
            --set "imagePullSecrets[0].name=ghcr-secret" \
            --set "secrets.existingSecret=messagebroker-secrets" \
            --set "config.database.host=${POSTGRES_HOST}" \
            --set "config.database.port=${POSTGRES_PORT}" \
            --set "config.database.database=${POSTGRES_DB}" \
            --timeout 5m
          echo "[OK] QA deploy complete"

      - name: Smoke Test (QA)
        run: |
          set -euo pipefail
          echo "[SMOKE] Waiting for QA pods to become ready..."
          kubectl rollout status deployment -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=message-broker-engine --timeout=4m || \
            kubectl rollout status deployment -n "$TARGET_NAMESPACE" --timeout=4m
          kubectl get pods -n "$TARGET_NAMESPACE" -o wide
          NOT_READY=$(kubectl get pods -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=message-broker-engine -o jsonpath='{range .items[*]}{.status.containerStatuses[*].ready}{"\n"}{end}' | grep -c false || true)
          if [ "$NOT_READY" -gt 0 ]; then
            echo "[FAIL] One or more containers are not ready"
            kubectl describe pods -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=message-broker-engine | tail -80
            kubectl logs -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=message-broker-engine --tail=80 --all-containers || true
            exit 1
          fi
          LOGS=$(kubectl logs -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=message-broker-engine --tail=200 --all-containers 2>&1 || true)
          if echo "$LOGS" | grep -qiE 'panic|FATAL'; then
            echo "[FAIL] Critical error pattern detected in QA logs"
            echo "$LOGS" | tail -50
            exit 1
          fi
          echo "[OK] QA smoke test passed"

      - name: Setup Node.js (for qa-e2e agent)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run QA E2E Agent
        env:
          TARGET_NAMESPACE: ${{ env.TARGET_NAMESPACE }}
          IMAGE_TAG: ${{ github.sha }}
          FAIL_FAST: 'true'
          READY_TIMEOUT_SECONDS: '300'
        run: |
          set -euo pipefail
          # Truncate IMAGE_TAG to 7 chars to match Helm deploy tag
          export IMAGE_TAG="${IMAGE_TAG:0:7}"

          cd MessageBrokerEngine/qa-e2e
          # Pure-node agent, zero npm dependencies - just run it.
          node index.js

      - name: Debug Ã¢â‚¬â€ Dump QA Cluster State on Failure
        if: failure()
        run: |
          set +e
          echo "=== Pods ==="
          kubectl get pods -n "$TARGET_NAMESPACE" -o wide
          echo "=== Recent Events ==="
          kubectl get events -n "$TARGET_NAMESPACE" --sort-by='.lastTimestamp' | tail -50
          echo "=== App Pod Logs ==="
          kubectl logs -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=message-broker-engine --tail=200 --all-containers || true

  deploy:
    name: Deploy to Kubernetes (Prod)
    runs-on: ubuntu-latest
    needs: deploy-qa
    if: github.ref == 'refs/heads/main' && needs.deploy-qa.result == 'success' && vars.KUBERNETES_ENABLED == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          path: MessageBrokerEngine

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.3'

      - name: Configure Kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Check Kubernetes Connection
        run: |
          echo "Verifying Kubernetes connection..."
          kubectl cluster-info
          kubectl get nodes
          echo "[OK] Kubernetes connection verified"

      - name: Fetch Secrets from Azure Key Vault
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          set -euo pipefail
          echo "Fetching secrets from Azure Key Vault..."

          if [ -z "${AZURE_CREDENTIALS:-}" ]; then
            echo "::error::AZURE_CREDENTIALS secret is empty or not set"
            exit 1
          fi

          CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')
          CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')
          TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId')

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$TENANT_ID" ]; then
            echo "::error::Invalid Azure credentials format"
            exit 1
          fi
          echo "[OK] Azure credentials parsed successfully"

          echo "[INFO] Authenticating with Azure..."
          az login --service-principal \
            --username "$CLIENT_ID" \
            --password "$CLIENT_SECRET" \
            --tenant "$TENANT_ID" \
            --output none
          echo "[OK] Successfully authenticated with Azure"

          # Required secrets
          REQUIRED_SECRETS=(
            "POSTGRES-HOST" "POSTGRES-PORT" "POSTGRES-USER" "POSTGRES-PASSWORD" "POSTGRES-DB"
          )

          # Optional secrets
          OPTIONAL_SECRETS=(
            "ELASTIC-CLOUD-ENDPOINT" "ELASTIC-CLOUD-USERNAME" "ELASTIC-CLOUD-PASSWORD"
          )

          echo "[INFO] Fetching required secrets..."
          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            ENV_NAME="${SECRET_NAME//-/_}"
            VALUE=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$SECRET_NAME" --query value -o tsv 2>&1) || {
              echo "::error::[FAIL] Failed to fetch required secret $SECRET_NAME"
              exit 1
            }
            if [ -z "$VALUE" ]; then
              echo "::error::[FAIL] Empty value for required secret $SECRET_NAME"
              exit 1
            fi
            echo "::add-mask::$VALUE"
            echo "${ENV_NAME}=${VALUE}" >> "$GITHUB_ENV"
            echo "[OK] Fetched $SECRET_NAME"
          done

          echo "[INFO] Fetching optional secrets..."
          for SECRET_NAME in "${OPTIONAL_SECRETS[@]}"; do
            ENV_NAME="${SECRET_NAME//-/_}"
            VALUE=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$SECRET_NAME" --query value -o tsv 2>/dev/null) || VALUE=""
            if [ -n "$VALUE" ]; then
              echo "::add-mask::$VALUE"
              echo "${ENV_NAME}=${VALUE}" >> "$GITHUB_ENV"
              echo "[OK] Fetched $SECRET_NAME"
            else
              echo "${ENV_NAME}=" >> "$GITHUB_ENV"
              echo "[SKIP] $SECRET_NAME not found in Key Vault (optional)"
            fi
          done

          echo "[OK] All secrets fetched successfully"

      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail
          echo "Deploying MessageBrokerEngine to Kubernetes..."

          cd MessageBrokerEngine

          # Create namespace if it doesn't exist
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Create image pull secret for GHCR
          echo "[INFO] Creating image pull secret..."
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Build DATABASE_URL
          DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"

          # Create Kubernetes secrets
          echo "[INFO] Creating application secrets in Kubernetes..."
          kubectl create secret generic messagebroker-secrets \
            --from-literal=database-username="${POSTGRES_USER}" \
            --from-literal=database-password="${POSTGRES_PASSWORD}" \
            --from-literal=database-host="${POSTGRES_HOST}" \
            --from-literal=database-port="${POSTGRES_PORT}" \
            --from-literal=database-name="${POSTGRES_DB}" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=elasticsearch-endpoint="${ELASTIC_CLOUD_ENDPOINT}" \
            --from-literal=elasticsearch-username="${ELASTIC_CLOUD_USERNAME}" \
            --from-literal=elasticsearch-password="${ELASTIC_CLOUD_PASSWORD}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "[OK] Secrets synced to Kubernetes"

          IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo "[INFO] Deploying with image tag: $IMAGE_TAG"

          # Check for stuck releases
          echo "[INFO] Checking Helm release status..."
          HELM_JSON=$(helm list -n ${{ env.NAMESPACE }} --all -o json 2>/dev/null || echo "[]")
          RELEASE_STATUS=$(echo "$HELM_JSON" | jq -r '.[] | select(.name=="messagebroker-engine") | .status' 2>/dev/null || echo "")

          if [[ "$RELEASE_STATUS" == *"pending"* ]]; then
            echo "[WARN] Found stuck release in status: $RELEASE_STATUS"
            if [ "$RELEASE_STATUS" = "pending-install" ]; then
              helm uninstall messagebroker-engine -n ${{ env.NAMESPACE }} --wait --timeout 2m 2>/dev/null || true
            else
              helm rollback messagebroker-engine -n ${{ env.NAMESPACE }} --wait --timeout 2m 2>/dev/null || true
            fi
            sleep 5
          elif [ "$RELEASE_STATUS" = "failed" ]; then
            echo "[WARN] Found failed release, rolling back..."
            helm rollback messagebroker-engine -n ${{ env.NAMESPACE }} --wait --timeout 2m 2>/dev/null || true
            sleep 5
          fi

          echo "Deploying with Helm..."
          helm upgrade --install messagebroker-engine ./${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f ./${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --set "image.repository=${{ env.IMAGE_NAME }}" \
            --set "image.tag=$IMAGE_TAG" \
            --set "image.pullPolicy=IfNotPresent" \
            --set "imagePullSecrets[0].name=ghcr-secret" \
            --set "secrets.existingSecret=messagebroker-secrets" \
            --set "config.database.host=${POSTGRES_HOST}" \
            --set "config.database.port=${POSTGRES_PORT}" \
            --set "config.database.database=${POSTGRES_DB}" \
            --timeout 5m

          echo "[OK] Helm deployment successful"

      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."

          echo "[INFO] Waiting for deployment to be ready..."
          if ! kubectl rollout status deployment/message-broker-engine -n ${{ env.NAMESPACE }} --timeout=3m; then
            echo "[WARN] Deployment not ready, checking logs..."
            kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=message-broker-engine --tail=30 || true
          fi

          echo ""
          echo "Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo ""
          echo "Services:"
          kubectl get services -n ${{ env.NAMESPACE }}
          echo ""
          echo "Deployments:"
          kubectl get deployments -n ${{ env.NAMESPACE }}
          echo ""
          echo "[OK] Deployment verification complete!"

      - name: Deployment Summary
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo ""
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Release: messagebroker-engine"
          echo "Image: ${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          echo ""
          echo "Rollback: helm rollback messagebroker-engine -n ${{ env.NAMESPACE }}"
          echo "=========================================="
