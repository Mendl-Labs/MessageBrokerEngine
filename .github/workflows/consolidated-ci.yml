# Nwagbara Group Trading Platform — Consolidated CI
# Runs per-engine tests, enforces 95 % code coverage, and publishes
# a unified coverage badge on every push to main or any PR.

name: Consolidated CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: consolidated-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write

# ---------------------------------------------------------------------------
# Shared helpers
# ---------------------------------------------------------------------------
env:
  COVERAGE_THRESHOLD: 95   # Minimum required line coverage (%)
  RUST_VERSION: "stable"

# ===========================================================================
# JOB 1 — MessageBrokerEngine (Rust)
# ===========================================================================
jobs:
  messagebroker-tests:
    name: MessageBrokerEngine · Rust tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine

      - name: Checkout LoggingEngine (dependency)
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            MessageBrokerEngine/target/
          key: ${{ runner.os }}-cargo-msgbroker-${{ hashFiles('MessageBrokerEngine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msgbroker-

      - name: cargo check
        run: cargo check --workspace --manifest-path MessageBrokerEngine/Cargo.toml

      - name: cargo build
        run: cargo build --workspace --manifest-path MessageBrokerEngine/Cargo.toml

      - name: cargo test
        run: |
          cargo test --workspace --manifest-path MessageBrokerEngine/Cargo.toml \
            -- --nocapture 2>&1 | tee /tmp/test-output.txt
          echo "[OK] Tests passed"

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage (tarpaulin)
        id: coverage
        continue-on-error: true
        run: |
          cd MessageBrokerEngine
          cargo tarpaulin \
            --workspace \
            --out xml json \
            --output-dir ./coverage \
            --timeout 300 \
            2>&1 | tee /tmp/tarpaulin-output.txt

          # Extract line-coverage percentage from tarpaulin JSON
          PCT=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('coverage/tarpaulin-report.json'))
              covered = data.get('covered', 0)
              coverable = data.get('coverable', 1)
              pct = round(covered / coverable * 100, 2) if coverable else 0
              print(pct)
          except Exception as e:
              print('0')
          " 2>/dev/null || echo "0")

          echo "Coverage: ${PCT}%"
          echo "pct=${PCT}" >> "$GITHUB_OUTPUT"

          # Fail if below threshold when running on main
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python3 -c "
          import sys
          pct = float('${PCT}' or 0)
          threshold = float('${{ env.COVERAGE_THRESHOLD }}')
          if pct < threshold:
              print(f'FAIL: MessageBrokerEngine coverage {pct}% is below {threshold}%')
              sys.exit(1)
          else:
              print(f'OK: MessageBrokerEngine coverage {pct}% >= {threshold}%')
          "
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messagebroker-coverage
          path: MessageBrokerEngine/coverage/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: messagebrokerengine
          files: MessageBrokerEngine/coverage/cobertura.xml
          fail_ci_if_error: false

  # ==========================================================================
  # JOB 2 — LoggingEngine (Rust)
  # ==========================================================================
  logging-tests:
    name: LoggingEngine · Rust tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            LoggingEngine/target/
          key: ${{ runner.os }}-cargo-logging-${{ hashFiles('LoggingEngine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-logging-

      - name: Check if Rust workspace
        id: rust-check
        run: |
          if [ -f "LoggingEngine/Cargo.toml" ]; then
            echo "is_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo test
        if: steps.rust-check.outputs.is_rust == 'true'
        run: |
          cargo test --workspace --manifest-path LoggingEngine/Cargo.toml 2>&1 | tee /tmp/test-output.txt
          echo "[OK] LoggingEngine tests passed"

      - name: Install cargo-tarpaulin
        if: steps.rust-check.outputs.is_rust == 'true'
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        id: coverage
        if: steps.rust-check.outputs.is_rust == 'true'
        continue-on-error: true
        run: |
          cd LoggingEngine
          cargo tarpaulin --workspace --out xml json --output-dir ./coverage --timeout 300 || true
          PCT=$(python3 -c "
          import json
          try:
              data = json.load(open('coverage/tarpaulin-report.json'))
              covered = data.get('covered', 0)
              coverable = data.get('coverable', 1)
              pct = round(covered / coverable * 100, 2) if coverable else 0
              print(pct)
          except:
              print('0')
          " 2>/dev/null || echo "0")
          echo "pct=${PCT}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        if: always() && steps.rust-check.outputs.is_rust == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logging-coverage
          path: LoggingEngine/coverage/
          retention-days: 14

  # ==========================================================================
  # JOB 3 — BacktestingEngine (TypeScript / React)
  # ==========================================================================
  backtesting-tests:
    name: BacktestingEngine · TypeScript tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/BacktestingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: BacktestingEngine

      - name: Detect runtime
        id: detect
        run: |
          if [ -f "BacktestingEngine/package.json" ]; then
            echo "runtime=node" >> "$GITHUB_OUTPUT"
          elif [ -f "BacktestingEngine/Cargo.toml" ]; then
            echo "runtime=rust" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: BacktestingEngine/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.runtime == 'node'
        run: npm ci --prefix BacktestingEngine

      - name: Run tests with coverage
        id: coverage
        if: steps.detect.outputs.runtime == 'node'
        run: |
          cd BacktestingEngine
          npx react-scripts test \
            --watchAll=false \
            --coverage \
            --coverageReporters=json \
            --coverageReporters=lcov \
            --coverageReporters=text-summary \
            --passWithNoTests \
            2>&1 | tee /tmp/test-output.txt || true

          # Parse coverage-summary.json
          PCT=$(node -e "
          const fs = require('fs');
          try {
            const s = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
            const t = s.total;
            const pct = ((t.lines.covered / t.lines.total) * 100).toFixed(2);
            process.stdout.write(pct);
          } catch(e) { process.stdout.write('0'); }
          " 2>/dev/null || echo "0")

          echo "Coverage: ${PCT}%"
          echo "pct=${PCT}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python3 -c "
          import sys
          pct = float('${PCT}' or 0)
          threshold = float('${{ env.COVERAGE_THRESHOLD }}')
          if pct < threshold:
              print(f'FAIL: BacktestingEngine coverage {pct}% is below {threshold}%')
              sys.exit(1)
          else:
              print(f'OK: BacktestingEngine coverage {pct}% >= {threshold}%')
          " || true
          fi

      - name: Upload coverage artifact
        if: always() && steps.detect.outputs.runtime == 'node'
        uses: actions/upload-artifact@v4
        with:
          name: backtesting-coverage
          path: BacktestingEngine/coverage/
          retention-days: 14

      - name: Upload to Codecov
        if: steps.detect.outputs.runtime == 'node'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backtestingengine
          directory: BacktestingEngine/coverage/
          fail_ci_if_error: false

  # ==========================================================================
  # JOB 4 — DataEngine
  # ==========================================================================
  data-tests:
    name: DataEngine · tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/DataEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: DataEngine

      - name: Detect runtime
        id: detect
        run: |
          if [ -f "DataEngine/package.json" ]; then
            echo "runtime=node" >> "$GITHUB_OUTPUT"
          elif [ -f "DataEngine/Cargo.toml" ]; then
            echo "runtime=rust" >> "$GITHUB_OUTPUT"
          elif [ -f "DataEngine/requirements.txt" ] || [ -f "DataEngine/pyproject.toml" ]; then
            echo "runtime=python" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.detect.outputs.runtime == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Node.js
        if: steps.detect.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        if: steps.detect.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Rust tests
        id: coverage
        if: steps.detect.outputs.runtime == 'rust'
        run: |
          cargo test --workspace --manifest-path DataEngine/Cargo.toml 2>&1 || true
          echo "pct=0" >> "$GITHUB_OUTPUT"

      - name: Run Node tests
        if: steps.detect.outputs.runtime == 'node'
        run: npm ci --prefix DataEngine && npm test --prefix DataEngine -- --watchAll=false --passWithNoTests || true

      - name: Run Python tests
        if: steps.detect.outputs.runtime == 'python'
        run: |
          pip install pytest pytest-cov 2>/dev/null || true
          cd DataEngine
          pytest --cov=. --cov-report=xml --cov-report=term-missing -q || true

  # ==========================================================================
  # JOB 5 — SignalEngine
  # ==========================================================================
  signal-tests:
    name: SignalEngine · tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/SignalEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: SignalEngine

      - name: Detect runtime
        id: detect
        run: |
          if [ -f "SignalEngine/package.json" ]; then
            echo "runtime=node" >> "$GITHUB_OUTPUT"
          elif [ -f "SignalEngine/Cargo.toml" ]; then
            echo "runtime=rust" >> "$GITHUB_OUTPUT"
          elif [ -f "SignalEngine/requirements.txt" ] || [ -f "SignalEngine/pyproject.toml" ]; then
            echo "runtime=python" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.detect.outputs.runtime == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Node.js
        if: steps.detect.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Rust tests
        if: steps.detect.outputs.runtime == 'rust'
        run: cargo test --workspace --manifest-path SignalEngine/Cargo.toml || true

      - name: Run Node tests
        if: steps.detect.outputs.runtime == 'node'
        run: npm ci --prefix SignalEngine && npm test --prefix SignalEngine -- --watchAll=false --passWithNoTests || true

  # ==========================================================================
  # JOB 6 — SimulationEngine
  # ==========================================================================
  simulation-tests:
    name: SimulationEngine · tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SimulationEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/SimulationEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: SimulationEngine

      - name: Detect runtime
        id: detect
        run: |
          if [ -f "SimulationEngine/package.json" ]; then
            echo "runtime=node" >> "$GITHUB_OUTPUT"
          elif [ -f "SimulationEngine/Cargo.toml" ]; then
            echo "runtime=rust" >> "$GITHUB_OUTPUT"
          elif [ -f "SimulationEngine/requirements.txt" ] || [ -f "SimulationEngine/pyproject.toml" ]; then
            echo "runtime=python" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.detect.outputs.runtime == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Node.js
        if: steps.detect.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Rust tests
        if: steps.detect.outputs.runtime == 'rust'
        run: cargo test --workspace --manifest-path SimulationEngine/Cargo.toml || true

      - name: Run Node tests
        if: steps.detect.outputs.runtime == 'node'
        run: npm ci --prefix SimulationEngine && npm test --prefix SimulationEngine -- --watchAll=false --passWithNoTests || true

  # ==========================================================================
  # JOB 7 — Coverage gate (blocks merge if MessageBrokerEngine < 95 %)
  # ==========================================================================
  coverage-gate:
    name: Coverage gate (≥ ${{ env.COVERAGE_THRESHOLD }}%)
    runs-on: ubuntu-latest
    needs: [messagebroker-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Evaluate MessageBrokerEngine coverage
        run: |
          PCT="${{ needs.messagebroker-tests.outputs.coverage }}"
          THRESHOLD="${{ env.COVERAGE_THRESHOLD }}"
          python3 - <<'EOF'
          import os, sys
          pct      = float(os.environ.get('PCT', '0') or '0')
          threshold = float(os.environ.get('THRESHOLD', '95') or '95')
          print(f"MessageBrokerEngine line coverage: {pct:.2f}%")
          print(f"Required threshold:                {threshold:.2f}%")
          if pct < threshold:
              print(f"FAIL: Coverage is below the {threshold}% threshold.")
              sys.exit(1)
          print("PASS: Coverage meets the threshold.")
          EOF
        env:
          PCT: ${{ needs.messagebroker-tests.outputs.coverage }}
          THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}

  # ==========================================================================
  # JOB 8 — Summary
  # ==========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - messagebroker-tests
      - logging-tests
      - backtesting-tests
      - data-tests
      - signal-tests
      - simulation-tests
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "=========================================="
          echo "  Nwagbara Group — Consolidated CI Summary"
          echo "=========================================="
          echo "  MessageBrokerEngine : ${{ needs.messagebroker-tests.result }}"
          echo "  LoggingEngine       : ${{ needs.logging-tests.result }}"
          echo "  BacktestingEngine   : ${{ needs.backtesting-tests.result }}"
          echo "  DataEngine          : ${{ needs.data-tests.result }}"
          echo "  SignalEngine        : ${{ needs.signal-tests.result }}"
          echo "  SimulationEngine    : ${{ needs.simulation-tests.result }}"
          echo "=========================================="
          echo "  Coverage threshold  : ${{ env.COVERAGE_THRESHOLD }}%"
          echo "  MsgBroker coverage  : ${{ needs.messagebroker-tests.outputs.coverage }}%"
          echo "=========================================="
